    <!-- 开屏加载（内联以消除首屏阻塞 CSS 请求） -->
    <style>
      .liu-splash-screen {
        --splash-bg: var(--bg-color, #eaecef);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 6000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        transition: opacity .12s ease-out;
        will-change: opacity;
      }
      .liuss-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .liuss-container {
        --uib-size: 45px;
        --uib-color: var(--main-text, #1f2429);
        --uib-speed: 2.5s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: var(--uib-size);
        width: var(--uib-size);
        transition: transform .12s ease-out;
        will-change: transform;
      }
      .liuss-hidden .liuss-container {
        transform: scale(1.6);
      }
      .liuss-slice {
        position: relative;
        height: calc(var(--uib-size) / 6);
        width: 100%;
      }
      .liuss-slice::before,
      .liuss-slice::after {
        --uib-a: calc(var(--uib-speed) / -2);
        --uib-b: calc(var(--uib-speed) / -6);
        content: '';
        position: absolute;
        top: 0;
        left: calc(50% - var(--uib-size) / 12);
        height: 100%;
        width: calc(100% / 6);
        border-radius: 50%;
        background-color: var(--uib-color);
        flex-shrink: 0;
        animation: orbit var(--uib-speed) linear infinite;
        transition: background-color 0.3s ease;
      }
      .liuss-slice:nth-child(1)::after { animation-delay: var(--uib-a); }
      .liuss-slice:nth-child(2)::before { animation-delay: var(--uib-b); }
      .liuss-slice:nth-child(2)::after { animation-delay: calc(var(--uib-a) + var(--uib-b)); }
      .liuss-slice:nth-child(3)::before { animation-delay: calc(var(--uib-b) * 2); }
      .liuss-slice:nth-child(3)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 2); }
      .liuss-slice:nth-child(4)::before { animation-delay: calc(var(--uib-b) * 3); }
      .liuss-slice:nth-child(4)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 3); }
      .liuss-slice:nth-child(5)::before { animation-delay: calc(var(--uib-b) * 4); }
      .liuss-slice:nth-child(5)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 4); }
      .liuss-slice:nth-child(6)::before { animation-delay: calc(var(--uib-b) * 5); }
      .liuss-slice:nth-child(6)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 5); }
      @keyframes orbit {
        0%, 100% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
        5% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.684208); opacity: 0.58; }
        10% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.631576); opacity: 0.51; }
        15% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.578944); opacity: 0.44; }
        20% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.526312); opacity: 0.37; }
        25% { transform: translateX(0%) scale(0.47368); opacity: 0.3; }
        30% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.526312); opacity: 0.37; }
        35% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.578944); opacity: 0.44; }
        40% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.631576); opacity: 0.51; }
        45% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.684208); opacity: 0.58; }
        50% { transform: translateX(calc(var(--uib-size) * -0.25)) scale(0.73684); opacity: 0.65; }
        55% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.789472); opacity: 0.72; }
        60% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.842104); opacity: 0.79; }
        65% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.894736); opacity: 0.86; }
        70% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.947368); opacity: 0.93; }
        75% { transform: translateX(0%) scale(1); opacity: 1; }
        80% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.947368); opacity: 0.93; }
        85% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.894736); opacity: 0.86; }
        90% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.842104); opacity: 0.79; }
        95% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.789472); opacity: 0.72; }
      }
    </style>

    <!-- manifest -->
    <link rel="manifest" id="manifest">
    <script>
      let manifestHref = "/manifest.json"
      try {
        const ua = navigator.userAgent.toLowerCase()
        if(ua.includes("iphone") || ua.includes("ipad") || ua.includes("ios")) {
          manifestHref = "/manifest-ios.json"
        }
      }
      catch(e) {}
      document.querySelector("#manifest").setAttribute("href", manifestHref)
    </script>
